name: Runtime and UX checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  vehicle3d:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/vehicle3d/requirements.txt
      - run: pip install -r scripts/vehicle3d/requirements.txt
      - run: python -m unittest discover -s scripts/vehicle3d -p 'test_*.py'
      # Blender/live image downloads require an explicitly selected local executable.
  runtime:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js benchmark check
      # Hosted CI has no account-bound model/VM. Its package is an unverified preview.
      - run: node scripts/package-cli.mjs --preview
  ux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:chat
      - run: npm run test:chat:runtime
      - run: node scripts/vehicle3d/verify-report.mjs
      - run: npm run eval:visual
      - run: node scripts/eval-autonomous-itinerary.mjs
      - run: node scripts/eval-autonomous-itinerary.mjs --case hamamatsu
      - run: node scripts/eval-autonomous-itinerary.mjs --case nagoya
      - run: node scripts/eval-experience-cases.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-screenshots
          path: |
            .runtime/vehicle3d/report-qa
            .runtime/ui-qa
            .runtime/chat-qa
            .runtime/chat-runtime-fixture
            .runtime/visual-study/qa
            .runtime/social-discovery/contrast
            .runtime/proposal-comparison/qa
            .runtime/cafe-itinerary/qa
            .runtime/autonomous-itinerary/qa
            .runtime/regional-itinerary/hamamatsu/qa
            .runtime/regional-itinerary/nagoya/qa
            .runtime/regional-itinerary/gallery-qa
            .runtime/experience-cases/qa
